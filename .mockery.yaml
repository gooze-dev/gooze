---
# Mockery configuration for generating mocks
with-expecter: true
disable-version-string: true
packages:
  gooze.dev/pkg/gooze/internal/domain:
    config:
      dir: internal/domain/mocks
      outpkg: mocks
    interfaces:
      Workflow:
      Orchestrator:
      Mutagen:
      Reporter:
      Workspace:
      TestChecker:
      ReportPublisher:
      GoFileAdapter:
      SourceFSAdapter:
      TestRunnerAdapter:
      ReportStore:
      OCIRegistry:
      Differ:
      ChangeDetector:
  gooze.dev/pkg/gooze/internal/controller:
    config:
      dir: internal/controller/mocks
      outpkg: mocks
    interfaces:
      UI:
  gooze.dev/pkg/gooze/pkg:
    config:
      inpackage: true
      dir: '{{.InterfaceDir}}'
      outpkg: '{{.PackageName}}'
      filename: mock_{{.InterfaceName}}.go
      mockname: Mock{{.InterfaceName}}
    interfaces:
      FileSpill:
  gooze.dev/pkg/gooze/pkg/config:
    config:
      inpackage: true
      dir: '{{.InterfaceDir}}'
      outpkg: '{{.PackageName}}'
      filename: mock_{{.InterfaceName}}.go
      mockname: Mock{{.InterfaceName}}
    interfaces:
      Registry:
  gooze.dev/pkg/gooze/pkg/report:
    config:
      inpackage: true
      dir: '{{.InterfaceDir}}'
      outpkg: '{{.PackageName}}'
      filename: mock_{{.InterfaceName}}.go
      mockname: Mock{{.InterfaceName}}
    interfaces:
      Reader:
