---
# Security rules for gooze: a mutation-testing CLI that copies projects into
# temp dirs, runs `go test` through os/exec, and unpacks tar archives pulled
# from OCI registries.
#
# Validate with:  semgrep --validate --config .semgrep/
rules:
- id: gooze-exec-command-built-from-strings
  languages: [go]
  severity: ERROR
  message: >-
    os/exec command or argument is assembled from a formatted or concatenated
    string. Pass the program and each argument as separate values instead of
    building a command line, and never route it through `sh -c`.
  metadata:
    category: security
    cwe: 'CWE-78: Improper Neutralization of Special Elements used in an OS Command'
    confidence: HIGH
  patterns:
  - pattern-either:
    - pattern: exec.Command(..., fmt.Sprintf(...), ...)
    - pattern: exec.CommandContext($CTX, ..., fmt.Sprintf(...), ...)
    - pattern: exec.Command(..., $A + $B, ...)
    - pattern: exec.CommandContext($CTX, ..., $A + $B, ...)
    - pattern: exec.Command(..., strings.Join(...), ...)
    - pattern: exec.CommandContext($CTX, ..., strings.Join(...), ...)
    - patterns:
      - pattern-either:
        - pattern: exec.Command("=~/^(sh|bash|dash|zsh)$/", "-c", $CMD, ...)
        - pattern: exec.CommandContext($CTX, "=~/^(sh|bash|dash|zsh)$/", "-c", $CMD, ...)
      - pattern-not: exec.Command("...", "-c", "...", ...)
      - pattern-not: exec.CommandContext($CTX, "...", "-c", "...", ...)

- id: gooze-archive-entry-path-traversal
  languages: [go]
  severity: ERROR
  message: >-
    Archive entry name is joined onto a destination directory without
    validation. A crafted entry such as `../../etc/passwd` escapes the
    extraction directory. Extract through `os.OpenRoot(destDir)` (see
    internal/adapter/archive.go) or reject names that are absolute or contain
    `..` before joining.
  metadata:
    category: security
    cwe: 'CWE-22: Improper Limitation of a Pathname to a Restricted Directory'
    confidence: MEDIUM
  patterns:
  - pattern-either:
    - pattern: 'filepath.Join($DEST, ($H : *tar.Header).Name)'
    - pattern: 'filepath.Join($DEST, ($F : *zip.File).Name)'
    - pattern: 'path.Join($DEST, ($H : *tar.Header).Name)'
    - pattern: 'path.Join($DEST, ($F : *zip.File).Name)'
    - patterns:
      - pattern-inside: |
          $H, $ERR := $TR.Next()
          ...
      - pattern-either:
        - pattern: filepath.Join($DEST, $H.Name)
        - pattern: path.Join($DEST, $H.Name)
  # Already validated against ".." or checked to stay under the destination.
  - pattern-not-inside: |
      if strings.Contains($X.Name, "..") { ... }
      ...
  - pattern-not-inside: |
      $P := filepath.Join($DEST, $X.Name)
      ...
      if !strings.HasPrefix($P, ...) { ... }
  - pattern-not-inside: |
      $P := filepath.Join($DEST, $X.Name)
      ...
      if strings.HasPrefix($P, ...) { ... }

- id: gooze-hardcoded-tmp-path
  languages: [go]
  severity: WARNING
  message: >-
    Hard-coded temporary path. Use `os.TempDir()` or `os.MkdirTemp` so the
    location honours TMPDIR, works on every platform and cannot collide with
    another user's files in a shared /tmp.
  metadata:
    category: security
    cwe: 'CWE-377: Insecure Temporary File'
    confidence: MEDIUM
  paths:
    exclude:
    - '*_test.go'
  pattern: '"=~/^\/(var\/)?tmp(\/|$)/"'
