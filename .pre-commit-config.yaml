---
repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v5.0.0
  hooks:
  - id: trailing-whitespace
    exclude: ^testdata/
  - id: end-of-file-fixer
    exclude: ^testdata/
  - id: check-yaml
  - id: check-added-large-files
  - id: check-merge-conflict
  - id: check-case-conflict
  - id: mixed-line-ending
    exclude: ^testdata/

- repo: https://github.com/jumanjihouse/pre-commit-hook-yamlfmt
  rev: 0.2.3
  hooks:
  - id: yamlfmt
    args: [--mapping, '2', --sequence, '2', --offset, '0']
    # Report fixtures are byte-for-byte gooze output.
    exclude: ^testdata/

- repo: local
  hooks:
  - id: go-fmt
    name: go fmt
    entry: make fmt
    language: system
    pass_filenames: false
    always_run: true
    types: [go]

  - id: go-lint
    name: golangci-lint
    entry: make lint
    language: system
    pass_filenames: false
    always_run: true
    types: [go]

  - id: go-test
    name: go test
    entry: make test
    language: system
    pass_filenames: false
    always_run: true
    types: [go]

  - id: go-mod-tidy
    name: go mod tidy
    entry: go mod tidy
    language: system
    pass_filenames: false
    files: go\.mod$

  - id: no-ignored-go-sources
    name: no Go sources hidden by .gitignore
    entry: sh -c 'files=$(git ls-files --others --ignored --exclude-standard -- "*.go"); test -z "$files" || { echo "Go files ignored by .gitignore:"; echo
      "$files"; exit 1; }'
    language: system
    pass_filenames: false
    always_run: true

- repo: https://github.com/semgrep/pre-commit
  rev: v1.181.0
  hooks:
  - id: semgrep
    name: semgrep
    args: [scan, --config, .semgrep/, --config, p/golang, --error, --disable-version-check, --quiet, --skip-unknown-extensions]
    types: [go]
    # pre-commit passes explicit file names, which bypass .semgrepignore; keep this in sync with it.
    exclude: ^(examples/|testdata/|.*/mocks/|.*/testdata/|pkg/(.*/)?mock_[^/]*\.go$)
    # One semgrep process for all files: a single report and a single registry fetch of p/golang.
    require_serial: true
