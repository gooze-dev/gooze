---
name: Mutation testing

# Runs on every pull request and on pushes to main. Every run pulls the :main
# baseline for the incremental cache, so unchanged files are skipped. Only a
# push to main (or a manual run on main, e.g. to seed the baseline) publishes
# the merged reports back to :main; pull requests never write to the registry.
# Pull requests are also gated: the diff job fails unless every mutant on the
# changed lines is killed. gooze is pinned to a release, not built from this
# branch, so a broken change can't weaken its own check; bump it after each
# release.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: read           # pull the baseline from GHCR

env:
  REPORTS_REF: ghcr.io/${{ github.repository }}/gooze-reports:main
  GOOZE_REGISTRY_USERNAME: ${{ github.actor }}
  GOOZE_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
  GOFLAGS: -buildvcs=false

jobs:
  test:
    runs-on: ubuntu-latest
    container: golang:1.27
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The checkout is still needed below so gooze has source to mutate.
    - name: Install gooze
      run: go install gooze.dev/pkg/gooze@v1.3.0

      # Reuse the main baseline so unchanged files are skipped (the cache).
    - name: Restore baseline from main
      run: gooze report pull "$REPORTS_REF" || echo "no baseline yet"

    - name: Run shard ${{ matrix.shard }}
      run: gooze run -p 2 -s ${{ matrix.shard }}/6 -x '^vendor/' -x '^mock_' ./...

      # Archive this shard's reports into a single tarball so the artifact is one
      # file; tar preserves the shard_N/ directory exactly through upload/download
      # (no upload-artifact path/least-common-ancestor surprises).
    - name: Archive shard reports
      run: tar -czf "shard_${{ matrix.shard }}.tgz" -C .gooze-reports "shard_${{ matrix.shard }}"
    - name: Upload shard reports
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: shard_${{ matrix.shard }}
        path: shard_${{ matrix.shard }}.tgz
        if-no-files-found: error

  # Pull requests only: every mutant on the lines the pull request changes must
  # be killed (threshold.diff.total in gooze.yaml). Gating a sharded diff run
  # isn't supported, so this job runs unsharded; diff mode only mutates the
  # changed lines, so it stays small.
  diff:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    container: golang:1.27
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0         # diff mode needs the merge base with the base branch
    - name: Install gooze
      run: go install gooze.dev/pkg/gooze@v1.3.0
    - name: Changed lines must be fully killed
      run: |
        git config --global --add safe.directory "$GITHUB_WORKSPACE"
        gooze run -p 2 --diff "origin/${{ github.base_ref }}" -x '^vendor/' -x '^mock_' ./...

  merge:
    needs: test
    runs-on: ubuntu-latest
    container: golang:1.27
    # Write access only here, for the main-only push below. Fork pull requests
    # get a read-only token regardless.
    permissions:
      contents: read
      packages: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Install gooze
      run: go install gooze.dev/pkg/gooze@v1.3.0

      # Pull main's baseline first so the merge keeps unchanged (cached) reports
      # alongside the shards' freshly-tested ones.
    - name: Restore baseline from main
      run: gooze report pull "$REPORTS_REF" || echo "no baseline yet"

      # Playwright-style: pull every shard's archive into one staging dir. The
      # tarballs are uniquely named (shard_0.tgz, ...), so merge-multiple is safe.
    - name: Download shard archives
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
      with:
        path: shard-archives
        pattern: shard_*
        merge-multiple: true

      # Unpack each tarball; each restores its own .gooze-reports/shard_N/ dir,
      # giving `gooze report merge` the shard_* layout it expects.
    - name: Extract shard reports
      run: |
        mkdir -p .gooze-reports
        for archive in shard-archives/*.tgz; do
          tar -xzf "$archive" -C .gooze-reports
        done

    - name: Merge shards
      run: gooze report merge

    - name: Show mutation score
      run: gooze report view

      # Only main publishes the merged baseline, so pull requests reuse the
      # results of the latest main run instead of re-testing every file.
    - name: Publish merged baseline (main only)
      if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
      run: gooze report push "$REPORTS_REF"
