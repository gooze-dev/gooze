---
name: Mutation testing

# Pull requests run the shards in diff mode: each shard mutates only its part
# of the lines changed since the base branch, and the merge job fails unless
# every one of those mutants is killed. Pushes to main (and manual runs) run
# every mutant, reusing the :main baseline as a cache for unchanged files, and
# publish the merged reports back to :main; pull requests never write to the
# registry. gooze is pinned to a release, not built from this branch, so a
# broken change can't weaken its own check; bump it after each release.
#
# Jobs run on the runner, not in the golang container: the container runs as
# root, where tests that rely on file permissions skip themselves, so CI would
# report survivors a local run kills.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: read           # pull the baseline from GHCR

env:
  REPORTS_REF: ghcr.io/${{ github.repository }}/gooze-reports:main
  GOOZE_REGISTRY_USERNAME: ${{ github.actor }}
  GOOZE_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
  GOFLAGS: -buildvcs=false
  # Diff runs write their shards under run/, full runs at the top level.
  REPORTS_DIR: ${{ github.event_name == 'pull_request' && '.gooze-reports/run' || '.gooze-reports' }}

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0         # diff mode needs the merge base with the base branch
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod
    - name: Install gooze
      run: go install gooze.dev/pkg/gooze@v1.3.0

      # Full runs reuse the main baseline, so unchanged files are skipped. A
      # diff run only mutates changed lines, which the cache can't skip.
    - name: Restore baseline from main
      if: github.event_name != 'pull_request'
      run: gooze report pull "$REPORTS_REF" || echo "no baseline yet"

    - name: Run shard ${{ matrix.shard }} (changed lines)
      if: github.event_name == 'pull_request'
      run: gooze run -p 2 -s ${{ matrix.shard }}/6 --diff "origin/${{ github.base_ref }}" -x '^vendor/' -x '^mock_' ./...
    - name: Run shard ${{ matrix.shard }}
      if: github.event_name != 'pull_request'
      run: gooze run -p 2 -s ${{ matrix.shard }}/6 -x '^vendor/' -x '^mock_' ./...

      # Archive this shard's reports into a single tarball so the artifact is one
      # file; tar preserves the shard_N/ directory exactly through upload/download
      # (no upload-artifact path/least-common-ancestor surprises).
    - name: Archive shard reports
      run: tar -czf "shard_${{ matrix.shard }}.tgz" -C "$REPORTS_DIR" "shard_${{ matrix.shard }}"
    - name: Upload shard reports
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: shard_${{ matrix.shard }}
        path: shard_${{ matrix.shard }}.tgz
        if-no-files-found: error

  merge:
    needs: test
    runs-on: ubuntu-latest
    # Write access only here, for the main-only push below. Fork pull requests
    # get a read-only token regardless.
    permissions:
      contents: read
      packages: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod
    - name: Install gooze
      run: go install gooze.dev/pkg/gooze@v1.3.0

      # Pull main's baseline first so the merge keeps unchanged (cached) reports
      # alongside the shards' freshly-tested ones.
    - name: Restore baseline from main
      if: github.event_name != 'pull_request'
      run: gooze report pull "$REPORTS_REF" || echo "no baseline yet"

      # Playwright-style: pull every shard's archive into one staging dir. The
      # tarballs are uniquely named (shard_0.tgz, ...), so merge-multiple is safe.
    - name: Download shard archives
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
      with:
        path: shard-archives
        pattern: shard_*
        merge-multiple: true

      # Unpack each tarball; each restores its own shard_N/ dir, giving
      # `gooze report merge` the shard_* layout it expects.
    - name: Extract shard reports
      run: |
        mkdir -p "$REPORTS_DIR"
        for archive in shard-archives/*.tgz; do
          tar -xzf "$archive" -C "$REPORTS_DIR"
        done

    - name: Merge shards
      run: gooze report merge -o "$REPORTS_DIR"

      # Survivors as annotations on the pull request's changed lines. Only
      # display: the gate below stays on the pinned release. --format github
      # isn't in a release yet, so this gooze comes from main, never from the
      # pull request; switch to the pinned one when a release has the flag.
      # Runs before the gate, and a low score (exit 3) doesn't fail it.
    - name: Annotate survivors
      if: github.event_name == 'pull_request'
      run: |
        GOBIN="$RUNNER_TEMP/gooze-main" go install gooze.dev/pkg/gooze@main
        "$RUNNER_TEMP/gooze-main/gooze" report view -o "$REPORTS_DIR" --format github || [ $? -eq 3 ]

      # The merged run/ holds only the changed lines' mutants, so the plain
      # total threshold is the diff gate. It's passed as a flag because
      # gooze v1.3.0 doesn't apply threshold.diff.* from gooze.yaml to merged
      # shards; keep it in sync with threshold.diff.total there.
    - name: Changed lines must be fully killed
      if: github.event_name == 'pull_request'
      run: gooze report view -o "$REPORTS_DIR" --threshold-total 100

    - name: Show mutation score
      if: github.event_name != 'pull_request'
      run: gooze report view

      # Only main publishes the merged baseline, so full runs reuse the results
      # of the latest main run instead of re-testing every file.
    - name: Publish merged baseline (main only)
      if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
      run: gooze report push "$REPORTS_REF"
